[project]
name = "quiddity"
version = "0.1.0"
description = "Agent-driven Asheron's Call companion: routines, combat, buffs, and inventory awareness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "rich>=13.0",
]

[project.scripts]
quiddity = "quiddity.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quiddity*"]
